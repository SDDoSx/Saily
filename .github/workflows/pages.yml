name: Deploy Saily to GitHub Pages

on:
  # main only: the github-pages environment allows no other branch, and a second run in the "pages"
  # concurrency group cancels the main deploy before failing on the environment rule.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (enables Pages for the repo if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stamp build id into service worker
        run: python3 tools/stamp_build.py "${GITHUB_SHA::8}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
