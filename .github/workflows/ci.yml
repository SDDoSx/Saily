name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/unit.js
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node tools/e2e.js
        env:
          SAILY_CHROMIUM: default
